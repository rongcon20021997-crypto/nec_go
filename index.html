:root{
  --ink:#302c25;--ink2:#4d4231;--deep:#c18b30;--deeper:#a77424;

function home(){return `<div class="screen-inner"><div class="home-head"><div class="hello">Xin chào, anh Khoa 👋<strong>Sẵn sàng lăn bánh?</strong></div><button class="avatar" data-action="go" data-page="profile">MK</button></div><div class="location-line">${ico('location','sm')} Vị trí của bạn <b>Thảo Điền, TP. Hồ Chí Minh</b>${ico('down','sm')}</div><section class="green-banner"><img class="banner-official-logo" src="${OFFICIAL_LOGO}" alt="CCG-GROUP"/><div class="banner-eyebrow">NEC GO · CHẠM ĐẾN NĂNG LƯỢNG XANH</div><h2>Sạc đầy năng lượng.<br>Đi trọn hành trình.</h2><button class="banner-btn" data-action="go" data-page="stations">Tìm trạm sạc ${ico('arrow','sm')}</button>${carArt}<div class="hero-stars">${ico('bolt','xl')}</div></section><div class="row between"><h3 class="h-section">Tiện ích của bạn</h3><span class="tiny-pill">24/7 hỗ trợ</span></div><div class="quick-grid"><button class="quick-btn" data-action="go" data-page="stations"><span>${ico('map')}</span>Tìm trạm</button><button class="quick-btn warm" data-action="go" data-page="rescue"><span>${ico('truck')}</span>Cứu hộ</button><button class="quick-btn blue" data-action="go" data-page="scan"><span>${ico('scan')}</span>Quét QR</button><button class="quick-btn purple" data-action="go" data-page="history"><span>${ico('history')}</span>Lịch sử</button></div><button class="vehicle-strip clickable" data-action="go" data-page="vehicles" style="width:100%;text-align:left"><span class="vehicle-badge">${ico('car','lg')}</span><span><h4>${VEHICLES[state.vehicle].name} <span class="tiny-pill">Đang sử dụng</span></h4><p>Biển số ${VEHICLES[state.vehicle].plate} · ${VEHICLES[state.vehicle].pin} pin</p></span><span class="endicon">${ico('chevron')}</span></button><div class="row between"><h3 class="h-section">Trạm sạc gần bạn</h3><button class="text-link" data-action="go" data-page="stations">Xem tất cả ${ico('arrow','sm')}</button></div>${S.slice(0,2).map(stationCard).join('')}<div style="height:9px"></div></div>`}
function mapVisual(){return `<div class="map-visual"><div class="map-grid-fill"></div><svg class="road-svg" viewBox="0 0 340 230" preserveAspectRatio="none"><rect width="340" height="230" fill="transparent"/><path d="M-20 37Q90 60 185 13T370 24M-20 112Q80 96 160 142T370 115M-20 204Q117 169 193 211T365 175M25 -30Q49 104 19 265M125 -20Q123 94 97 260M230 -20Q205 103 263 257" fill="none" stroke="#fff" stroke-width="21"/><path d="M-20 37Q90 60 185 13T370 24M-20 112Q80 96 160 142T370 115M-20 204Q117 169 193 211T365 175M25 -30Q49 104 19 265M125 -20Q123 94 97 260M230 -20Q205 103 263 257" fill="none" stroke="#d8e2d8" stroke-width="2" stroke-dasharray="5 8"/></svg><div class="map-water"></div><div class="map-label" style="left:17%;top:20%">Xuân Thủy</div><div class="map-label" style="left:52%;top:53%">Nguyễn Hữu Cảnh</div><div class="map-label" style="left:14%;top:80%">Mai Chí Thọ</div>${S.map(s=>`<button class="map-pin ${state.selectedStation===s.id?'selected':''}" style="left:${s.pos[0]}%;top:${s.pos[1]}%" title="${s.name}" data-action="map-pin" data-id="${s.id}">${ico('bolt')}</button>`).join('')}<span class="you-pin"></span></div>`}
function stations(){let list=S.filter(s=>(!state.search||(s.name+' '+s.address).toLowerCase().includes(state.search.toLowerCase()))&&(state.filter==='Tất cả'||state.filter==='Yêu thích'&&state.favs.includes(s.id)||state.filter==='DC nhanh'&&s.type==='DC'||state.filter==='AC'&&s.type==='AC'));return `${pageHead('Tìm trạm sạc','home',`<button class="header-icon" data-action="go" data-page="scan">${ico('scan')}</button>`)}<div class="screen-inner"><div class="search">${ico('search')}<input id="station-search" placeholder="Tên trạm, địa chỉ, khu vực..." value="${escapeHtml(state.search)}" autocomplete="off"/><button style="border:0;background:transparent;color:#a2b2a2" data-action="search-clear">${ico('filter','sm')}</button></div><div class="filterrow">${['Tất cả','DC nhanh','AC','Yêu thích'].map(f=>`<button class="chip ${state.filter===f?'selected':''}" data-action="filter" data-value="${f}">${f}</button>`).join('')}</div>${mapVisual()}<div class="viewmode"><b>${list.length} trạm sạc phù hợp</b><span class="muted">Gần nhất ${ico('down','sm')}</span></div>${list.length?list.map(stationCard).join(''):`<div class="empty">Chưa có trạm phù hợp bộ lọc của bạn.</div>`}</div>`}
function detail(){const s=activeStation();return `${pageHead('Chi tiết trạm sạc','stations',`<button class="header-icon" data-action="fav" data-id="${s.id}">${ico('heart')}</button>`)}<div class="detail-hero">${charger(true)}<span style="position:absolute;z-index:2;top:12px;left:13px;border-radius:30px;background:#fff9;padding:6px 10px;font-size:10px;color:#39764d;font-weight:800">${ico('bolt','sm')} ${s.ports} cổng khả dụng</span></div><div class="detail-body"><h2>${s.name}</h2><div class="detail-sub">${ico('location','sm')} ${s.address}</div><div class="detail-info"><div><strong>${s.km}</strong><small>Khoảng cách</small></div><div><strong>${s.power} kW</strong><small>Công suất tối đa</small></div><div><strong>★ ${s.rating}</strong><small>Đánh giá</small></div></div><div class="row between"><h3 class="h-section" style="margin:8px 0 12px">Cổng sạc khả dụng</h3><small class="avail">${s.ports}/${s.total} trống</small></div>${[['CCS2',s.power+' kW · DC nhanh'],['Type 2','22 kW · AC tiêu chuẩn']].map(([name,desc])=>`<button class="plug-row ${state.connector===name?'selected':''}" style="width:100%;text-align:left" data-action="connector" data-value="${name}"><span class="plug-icon">${ico('plug')}</span><span><h4>${name}</h4><p>${desc}</p></span><span>${state.connector===name?'Đã chọn':name==='CCS2'?'Còn trống':'Khả dụng'}</span></button>`).join('')}<div class="row between" style="margin:17px 0 6px"><small class="muted">Đơn giá từ</small><b style="font-size:19px">${fmt(s.price)}<small style="font-size:11px;color:#94a498">/kWh</small></b></div><div class="action-row"><button class="secondary" data-action="directions">${ico('route','sm')} Chỉ đường</button><button class="primary" data-action="go" data-page="scan">${ico('scan')} Quét QR để sạc</button></div><p class="helper">Trạng thái trụ và thao tác bắt đầu/kết thúc phụ thuộc API nhà cung cấp trạm. Hiện là dữ liệu demo.</p></div>`}
function scan(){return `${pageHead('Quét mã QR cổng sạc','stations')}<div class="screen-inner"><div class="center" style="padding-top:11px"><div class="center-title">Sẵn sàng nạp năng lượng?</div><p class="subtitle">Đưa mã QR trên cổng sạc vào khung bên dưới<br>hoặc mô phỏng thao tác quét để trải nghiệm.</p></div><div class="scanner"><div class="scan-corners"><div class="fakeqr">${qrSquares()}</div><span class="scan-line"></span></div></div><div class="info-box">${ico('info')}<span>Đang chọn <b>${activeStation().name} · ${state.connector}</b>. Mã QR hiển thị là hình minh họa, không kết nối trụ sạc thực tế.</span></div><div style="height:16px"></div><button class="primary" data-action="start-charge">${ico('scan')} Mô phỏng quét và bắt đầu sạc</button><button class="secondary" style="width:100%;margin-top:9px" data-action="go" data-page="detail">Đổi cổng sạc</button></div>`}
function qrSquares(){return Array.from({length:225},(_,i)=>{let x=i%15,y=Math.floor(i/15);let inside=(ox,oy)=>x>=ox&&x<ox+5&&y>=oy&&y<oy+5;let finder=(ox,oy)=>inside(ox,oy)&&((x===ox||x===ox+4||y===oy||y===oy+4)||(x>=ox+2&&x<=ox+2&&y>=oy+2&&y<=oy+2));let dark=finder(0,0)||finder(10,0)||finder(0,10)||(!(inside(0,0)||inside(10,0)||inside(0,10))&&((x*13+y*7+x*y)%7)<3);return `<span class="${dark?'dark':''}"></span>`}).join('')}
function charge(){if(!state.session){state.page='scan';return scan()}const s=activeStation();return `${pageHead('Phiên sạc của bạn','home')}<div class="charging-header"><div class="charging-kicker"><span></span> ĐANG SẠC · DEMO</div><h2>${s.name}</h2><div class="meter"><svg viewBox="0 0 230 230"><circle cx="115" cy="115" r="97" stroke="#356254" stroke-width="15" fill="none"/><circle cx="115" cy="115" r="97" stroke="#d1f17f" stroke-width="15" fill="none" stroke-linecap="round" stroke-dasharray="610" stroke-dashoffset="198"/></svg><div class="meter-core"><div class="bolt">${ico('bolt','xl')}</div><b>68%</b><small>Pin hiện tại (mô phỏng)</small></div></div><div style="font-size:11px;color:#b5cfbe">Dự kiến đầy pin sau 45 phút</div></div><div class="charging-stats"><div class="cstat"><b>12,8</b><small>Điện năng · kWh</small></div><div class="cstat"><b>00:26:15</b><small>Thời gian sạc</small></div><div class="cstat"><b>${fmt(Math.round(12.8*s.price))}</b><small>Tạm tính</small></div></div><div class="screen-inner"><div class="plug-row" style="margin-top:13px"><div class="plug-icon">${ico('plug')}</div><span><h4>${state.connector} · ${s.power} kW</h4><p>Cổng sạc A02 · Giao dịch #SC2026</p></span><span class="avail">Đang sạc</span></div><div class="info-box">${ico('info')}<span>Đây là phiên sạc mô phỏng. Số liệu được dùng để trình bày giao diện, không phải dữ liệu thời gian thực từ thiết bị.</span></div><button class="primary" data-action="stop-charge" style="margin-top:22px;background:#194d3a">${ico('check')} Kết thúc phiên sạc</button></div>`}
function rescue(){return `${pageHead('Yêu cầu cứu hộ','home')}<div class="screen-inner"><div class="rescue-hero"><div><h3>Bạn cần hỗ trợ?</h3><p>Đội ngũ cứu hộ sẵn sàng tiếp nhận yêu cầu và đồng hành cùng bạn.</p></div><div class="floating-icon">${ico('truck','xl')}</div></div><h3 class="h-section">Xe đang gặp vấn đề gì?</h3><div class="type-grid">${types.map(t=>`<button class="type-option ${state.rescueType===t[0]?'active':''}" data-action="rescue-type" data-value="${t[0]}"><span class="type-icon">${ico(t[1])}</span>${t[0]}</button>`).join('')}</div><label class="fieldlabel">Vị trí cần cứu hộ</label><button class="address-box" style="width:100%;text-align:left" data-action="rescue-location">${ico('location')}<span>${state.rescueAddress}</span>${ico('edit','sm')}</button><label class="fieldlabel">Phương tiện</label><button class="vehicle-choice" data-action="go" data-page="vehicles" style="margin-bottom:0">${ico('car','lg')}<span><b>${VEHICLES[state.vehicle].name}</b><small>${VEHICLES[state.vehicle].plate}</small></span>${ico('chevron','sm')}</button><label class="fieldlabel" for="rescue-desc">Mô tả thêm (không bắt buộc)</label><textarea class="text-field textarea" id="rescue-desc" placeholder="Ví dụ: Xe báo lỗi, không thể di chuyển...">${escapeHtml(state.rescueDescription)}</textarea><label class="fieldlabel">Hình ảnh hiện trường</label><label class="upload-btn">${ico('image')} ${state.uploadCount?'Đã chọn '+state.uploadCount+' ảnh':'Thêm ảnh sự cố (tùy chọn)'}<input id="image-upload" style="display:none" type="file" accept="image/*" multiple /></label><div class="costbox"><span>Chi phí tham khảo<br><small class="muted">Giá thực tế do đơn vị cứu hộ xác nhận</small></span><b>${fmt(rescueCost())}</b></div><button class="primary" data-action="create-rescue">${ico('send')} Gửi yêu cầu cứu hộ</button><p class="helper">Demo sử dụng tiếp nhận và phân công thủ công từ Web Admin; không mô phỏng GPS đối tác realtime.</p></div>`}
function rescueCost(){return {'Hết pin':350000,'Sạc lưu động':350000,'Kéo xe':500000,'Thủng lốp':200000,'Sự cố khác':250000}[state.rescueType]||350000}
function track(){const o=order(state.ownOrder);if(!o)return `${pageHead('Theo dõi cứu hộ','rescue')}<div class="screen-inner"><div class="empty">Bạn chưa có yêu cầu cứu hộ mới. ${ico('truck')}<button class="primary" style="margin-top:13px" data-action="go" data-page="rescue">Tạo yêu cầu ngay</button></div></div>`;return `${pageHead('Theo dõi cứu hộ','home')}<div class="screen-inner"><div class="row between" style="padding-top:12px"><span class="tiny semibold muted">MÃ YÊU CẦU ${o.id}</span><span class="pstatus ${o.step<2?'orange':''}">${steps[o.step]}</span></div><h2 style="font-size:22px;margin:12px 0 9px;letter-spacing:-.5px">${o.type}</h2><p class="subtitle" style="margin:0 0 18px">${ico('location','sm')} ${o.location}</p><div class="map-visual" style="height:148px">${mapVisual().replace('<div class="map-visual">','<div style="height:100%;position:relative">')}</div><h3 class="h-section">Trạng thái yêu cầu</h3></div><div class="stepper">${steps.map((x,i)=>`<div class="step ${i<o.step?'done':i===o.step?'current':''}"><div class="stepcircle">${i<o.step?ico('check','sm'):(i+1)}</div><div><b>${x}</b><small>${i===0?'Tiếp nhận yêu cầu trên hệ thống':i===1?'Đơn vị điều phối đã phân công đối tác':i===2?'Đối tác chuẩn bị đến vị trí hỗ trợ':i===3?'Đang triển khai xử lý sự cố':'Ghi nhận kết quả và hoàn thành'}</small></div></div>`).join('')}</div><div class="screen-inner">${o.assigned?`<div class="assigned"><div class="bubble">NH</div><div><h4>Đội cứu hộ NEC Partner</h4><p>Nhân viên đã được phân công</p></div><button class="phone-btn" data-action="call" title="Gọi cứu hộ">${ico('call')}</button></div>`:`<div class="info-box orange">${ico('info')}<span>Yêu cầu đang chờ điều phối viên tiếp nhận và phân công thủ công trên Web Admin.</span></div>`}<div class="costbox"><span>Giá dịch vụ dự kiến</span><b>${fmt(o.cost)}</b></div>${o.step===4?`<button class="primary" data-action="rate">${ico('star')} Đánh giá dịch vụ</button>`:o.step===0?`<button class="secondary" style="width:100%" data-action="cancel-order">Hủy yêu cầu</button>`:''}</div>`}
function history(){const records=state.history.filter(r=>state.payTab==='Tất cả'||(state.payTab==='Sạc xe'&&r.kind==='charge')||(state.payTab==='Cứu hộ'&&r.kind==='rescue'));return `${pageHead('Lịch sử & giao dịch','home')}<div class="screen-inner"><div class="activity-filter" style="margin-top:10px">${['Tất cả','Sạc xe','Cứu hộ'].map(x=>`<button class="chip ${state.payTab===x?'selected':''}" data-action="paytab" data-value="${x}">${x}</button>`).join('')}</div>${records.length?records.map(r=>`<div class="record"><div class="record-icon ${r.kind==='rescue'?'rescue':''}">${ico(r.kind==='rescue'?'truck':'bolt')}</div><div><h4>${r.title}</h4><p>${r.date}</p></div><b>${fmt(r.amount)}</b></div>`).join(''):`<div class="empty">Chưa có giao dịch phù hợp.</div>`}<div class="info-box" style="margin-top:16px">${ico('wallet')}<span>Thanh toán QR hoặc cổng thanh toán được tích hợp khi triển khai chính thức. Demo chỉ hiển thị kết quả giao dịch giả lập.</span></div></div>`}
function receipt(){const s=activeStation(),amt=state.lastChargeAmount||49920;return `${pageHead('Hoàn tất phiên sạc','history')}<div class="screen-inner center"><div class="receipt-check">${ico('check','xl')}</div><h2 class="center-title">Phiên sạc hoàn tất!</h2><p class="subtitle">Cảm ơn bạn đã đồng hành cùng NEC GO.</p><div class="receipt-amount">${fmt(amt)}</div><p class="subtitle">Tổng chi phí phiên sạc (demo)</p><div style="text-align:left;margin-top:34px"><div class="receipt-line"><span>Trạm sạc</span><b>${s.name}</b></div><div class="receipt-line"><span>Cổng sạc</span><b>${state.connector}</b></div><div class="receipt-line"><span>Điện năng tiêu thụ</span><b>12,8 kWh</b></div><div class="receipt-line"><span>Thời gian</span><b>26 phút 15 giây</b></div><div class="receipt-line"><span>Thanh toán</span><b>QR (mô phỏng)</b></div></div><button class="primary" style="margin-top:30px" data-action="go" data-page="history">Xem lịch sử giao dịch</button><button class="secondary" style="width:100%;margin-top:10px" data-action="go" data-page="home">Về trang chủ</button></div>`}
function profile(){return `${pageHead('Tài khoản','home')}<div class="screen-inner"><div class="profile-card"><div class="bigavatar">MK</div><div><h3>Nguyễn Minh Khoa</h3><small>090 123 4567 · Thành viên NEC GO</small></div></div><h3 class="h-section">Cá nhân</h3>${[['car','Phương tiện của tôi','vehicles'],['history','Lịch sử giao dịch','history'],['bell','Thông báo','notifications'],['shield','Trung tâm hỗ trợ','support'],['settings','Điều khoản & chính sách','support']].map(([ic,text,to])=>`<button class="profile-row" style="width:100%;background:none;border-width:0 0 1px;text-align:left" data-action="go" data-page="${to}">${ico(ic)}<span>${text}</span>${ico('chevron')}</button>`).join('')}<div class="support-banner">${ico('leaf')} Cùng NEC kiến tạo hành trình di chuyển xanh hơn.</div><p class="center muted tiny" style="padding:17px">NEC GO v1.0 · Interactive Prototype</p></div>`}
function vehicles(){return `${pageHead('Phương tiện của tôi','profile')}<div class="screen-inner"><h3 class="h-section">Chọn xe đang sử dụng</h3>${VEHICLES.map((v,i)=>`<button class="vehicle-choice ${state.vehicle===i?'active':''}" data-action="vehicle" data-index="${i}"><span class="vehicle-badge">${ico('car')}</span><span><b>${v.name}</b><small>${v.plate} · ${v.pin} pin</small></span><span>${state.vehicle===i?ico('check'):ico('chevron')}</span></button>`).join('')}<div class="info-box" style="margin-top:13px">${ico('info')}<span>Quản lý nhiều phương tiện, thông tin xe và lựa chọn phương tiện hiện tại theo phạm vi brief.</span></div><button class="secondary" style="width:100%;margin-top:17px" data-action="add-vehicle">${ico('car')} Thêm xe mới</button></div>`}

function adminSettings(){return `<div class="admin-list-cards">${[['bell','Thông báo & nội dung','Quản lý nội dung banner, thông báo đẩy FCM và hướng dẫn sử dụng.'],['wallet','Cấu hình thanh toán','Một cổng thanh toán theo phương án hai bên thống nhất.'],['shield','Vai trò & phân quyền','Admin, nhân viên điều phối, quản trị viên theo quyền.'],['truck','Cấu hình dịch vụ','Danh mục cứu hộ, biểu phí tham khảo và hotline.']].map(([i,h,p])=>`<div class="admin-list-card"><div class="row" style="gap:8px;color:#50875e">${ico(i)}<h4>${h}</h4></div><p>${p}</p><button class="admin-mini" data-action="demo-add">Xem cấu hình ${ico('arrow','sm')}</button></div>`).join('')}</div>`}
function adminWindow(){const tabs=[['dashboard','chart','Tổng quan'],['stations','plug','Trạm sạc'],['rescue','truck','Điều phối cứu hộ'],['transactions','cash','Giao dịch'],['customers','users','Khách hàng'],['settings','settings','Cấu hình']];const t=({dashboard:adminDashboard,stations:adminStations,rescue:adminRescue,transactions:adminTransactions,customers:adminCustomers,settings:adminSettings})[state.adminPage];const tab=tabs.find(x=>x[0]===state.adminPage)||tabs[0];return `<div class="admin-window"><aside class="admin-left"><div class="admin-logo"><img class="admin-brand-img" src="${OFFICIAL_LOGO}" alt="Logo CCG-GROUP"/><span>NEC <em>GO</em><small>ADMIN CONSOLE</small></span></div>${tabs.map(([id,ic,name])=>`<button class="admin-menu-btn ${state.adminPage===id?'active':''}" data-action="admin-page" data-page="${id}">${ico(ic)} ${name}</button>`).join('')}</aside><div class="admin-content"><header class="admin-top"><div><h2>${tab[2]}</h2><p>Xin chào, Quản trị viên · Thứ Tư, 14/10/2026</p></div><div class="admin-user"><span style="color:#a2b5a5">${ico('bell')}</span><span class="round">AD</span><b>Admin NEC</b>${ico('down','sm')}</div></header><div class="admin-pad">${t()}<div class="admin-footer">NEC GO · Admin Prototype — Dữ liệu mô phỏng, không phát sinh thao tác thật.</div></div></div></div>`}
function leftPanel(){const screens=state.role==='customer'?[['home','home','Trang chủ'],['stations','map','Tìm trạm sạc'],['detail','plug','Chi tiết trạm'],['scan','scan','Quét QR'],['charge','bolt','Phiên sạc'],['rescue','truck','Yêu cầu cứu hộ'],['track','route','Theo dõi cứu hộ'],['history','history','Giao dịch'],['profile','user','Tài khoản']]:state.role==='partner'?[['jobs','box','Đơn được giao'],['detail','route','Xử lý yêu cầu'],['history','history','Lịch sử công việc']]:[['dashboard','chart','Dashboard'],['stations','plug','Trạm sạc'],['rescue','truck','Điều phối cứu hộ'],['transactions','wallet','Giao dịch'],['customers','users','Khách hàng'],['settings','settings','Cấu hình']];let current=state.role==='customer'?state.page:state.role==='partner'?state.partnerPage:state.adminPage;return `<aside class="sidebar"><div class="side-logo-line"><img src="${OFFICIAL_LOGO}" alt="CCG-GROUP"><span><b>NEC GO</b><small>Premium interactive demo</small></span></div><div class="side-caption">CHỌN NỀN TẢNG DEMO</div>${[['customer','phone','App khách hàng','iOS / Android'],['admin','chart','Web Admin','Quản trị & điều phối'],['partner','truck','Web đối tác cứu hộ','Mobile web']].map(([role,ic,note,desc])=>`<button class="role-select ${state.role===role?'active':''}" data-action="role" data-role="${role}"><div class="role-icon">${ico(ic,'lg')}</div><span><strong>${note}</strong><small>${desc}</small></span></button>`).join('')}<div class="sidebar-rule"></div><div class="side-caption">DANH SÁCH MÀN HÌNH</div><div class="screen-nav">${screens.map(([id,ic,label])=>`<button class="screen-link ${current===id?'active':''}" data-action="sidepage" data-page="${id}">${ico(ic)}${label}</button>`).join('')}</div><div class="sidebar-bottom"><h4>Prototype tương tác</h4><p>Thử tạo yêu cầu từ App → phân công trên Admin → cập nhật trạng thái từ Web đối tác.</p><div class="dotrow"><span></span><span></span><span></span><span></span><span></span></div></div></aside>`}
function rightPanel(){const mobileSteps=state.role==='partner'?[['Đơn được giao','Nhận nhiệm vụ từ bộ phận điều phối'],['Xử lý yêu cầu','Gọi khách, điều hướng và cập nhật trạng thái'],['Lịch sử','Ghi nhận chi phí và kết quả xử lý']]:[['Tìm trạm gần bạn','Xem vị trí, cổng sạc, công suất, giá'],['Quét QR / Bắt đầu','Mô phỏng lựa chọn cổng và khởi tạo phiên sạc'],['Theo dõi & kết thúc','Xem điện năng, thời gian, chi phí'],['Yêu cầu cứu hộ','Điền loại sự cố, vị trí và phương tiện'],['Admin điều phối','Phân công đối tác cứu hộ thủ công'],['Đối tác cập nhật','Nhân viên ghi nhận tiến độ xử lý']];return `<aside class="right-panel"><h3>Hướng dẫn trải nghiệm</h3><p class="intro">Bản demo thiết kế dựa trên phạm vi tính năng trong tài liệu báo giá ngày 13/10/2026 và tham khảo định hướng năng lượng sạch của NEC.</p><div class="rail-title">HÀNH TRÌNH NGƯỜI DÙNG</div>${mobileSteps.map(([h,p],i)=>`<div class="flowstep"><span class="num">0${i+1}</span><div><b>${h}</b>${p}</div></div>`).join('')}<div class="rail-title">LƯU Ý DEMO</div><div class="rail-note">${ico('info')}Bản HTML chạy độc lập; toàn bộ dữ liệu trạm sạc, giá, đơn hàng, biểu đồ và thông tin tài xế là dữ liệu mô phỏng. Quét QR, thanh toán và điều khiển trụ sạc không kết nối API thật.</div><button class="rail-btn" data-action="role" data-role="${state.role==='customer'?'admin':'customer'}">${state.role==='customer'?'Khám phá Web Admin →':'← Quay về App tài xế'}</button><div class="rail-metrics"><div><b>03</b><span>Hệ giao diện</span></div><div><b>18+</b><span>Màn hình / phân hệ</span></div></div></aside>`}
function render({keepScroll=false}={}){const prev=document.getElementById('screenScroll');const top=keepScroll&&prev?prev.scrollTop:0;const [title,desc]=pageMeta();const roles={customer:'APP KHÁCH HÀNG',admin:'HỆ THỐNG ADMIN',partner:'WEB MOBILE ĐỐI TÁC'};document.getElementById('root').innerHTML=`<header class="header"><div class="brand"><img class="official-brand" src="${OFFICIAL_LOGO}" alt="Logo chính thức CCG-GROUP"><span><span class="brandname">NEC <b>GO</b><span style="font-size:9px;color:#94a598;vertical-align:top;margin-left:4px;letter-spacing:0">DEMO</span></span><div class="brandcaption">CCG-GROUP · EV CHARGING & RESCUE</div></span></div><div class="header-mid"><span class="online"></span> Interactive Prototype · 2026</div><div class="header-end"><span class="header-tag">NEC × FOSO</span><span>Thiết kế giao diện trải nghiệm</span></div></header><div class="workspace ${state.role==='admin'?'admin-mode':''}">${leftPanel()}<main class="stage"><div class="stage-head"><div><h1>${title}</h1><p>${desc}</p></div><span class="stage-chip">${roles[state.role]}</span></div>${state.role==='admin'?adminWindow():state.role==='partner'?partnerScreen():mobileScreen()}</main>${rightPanel()}</div><button class="mobile-role-switch" data-action="cycle-role">${ico('layers','sm')} ${state.role==='customer'?'Xem Admin':state.role==='admin'?'Xem đối tác':'Xem App'}</button>`;const n=document.getElementById('screenScroll');if(n)n.scrollTop=top}
function go(page){state.page=page;render()}
let toastTimeout=null;function toast(msg){const t=document.getElementById('toast-host');t.innerHTML=`<div class="demo-toast">${ico('check')} ${msg}</div>`;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>t.innerHTML='',3100)}
function directions(){const s=activeStation();const address=state.role==='partner'?(order(state.activeOrder)?.location||s.address):s.address;const q=encodeURIComponent(address);window.open('https://www.google.com/maps/search/?api=1&query='+q,'_blank','noopener,noreferrer');toast('Đang mở bản đồ ngoài để tìm vị trí minh họa.')}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function handle(action,d){switch(action){case'cycle-role':state.role=state.role==='customer'?'admin':state.role==='admin'?'partner':'customer';render();return;case'role':state.role=d.role;render();return;case'go':go(d.page);return;case'sidepage':if(state.role==='customer')state.page=d.page;else if(state.role==='admin')state.adminPage=d.page;else state.partnerPage=d.page;render();return;case'admin-page':state.adminPage=d.page;render();return;case'partner-page':state.partnerPage=d.page;render();return;case'station-detail':state.selectedStation=Number(d.id);go('detail');return;case'map-pin':state.selectedStation=Number(d.id);render({keepScroll:true});toast('Đã chọn '+activeStation().name);return;case'filter':state.filter=d.value;render({keepScroll:true});return;case'search-clear':state.search='';render({keepScroll:true});return;case'fav':{const id=Number(d.id);state.favs=state.favs.includes(id)?state.favs.filter(x=>x!==id):[...state.favs,id];render({keepScroll:true});toast('Đã cập nhật danh sách yêu thích.');return}case'connector':state.connector=d.value;render({keepScroll:true});return;case'start-charge':if(state.session){toast('Đang có phiên sạc. Hãy kết thúc phiên trước.');go('charge');return}state.session={start:Date.now(),stationId:state.selectedStation};go('charge');toast('Đã mô phỏng khởi tạo phiên sạc thành công.');return;case'stop-charge':{const cost=Math.round(12.8*activeStation().price);state.lastChargeAmount=cost;state.history.unshift({title:'Sạc xe • '+activeStation().name,date:'14/10/2026 • 12:14',amount:cost,kind:'charge'});state.session=null;go('receipt');return}case'rescue-type':state.rescueType=d.value;render({keepScroll:true});return;case'rescue-location':{const val=prompt('Nhập địa chỉ cần cứu hộ (dữ liệu demo):',state.rescueAddress);if(val&&val.trim()){state.rescueAddress=val.trim();render({keepScroll:true})}return}case'create-rescue':{const id='RH-'+String(2409+state.orders.filter(x=>x.id.startsWith('RH-24')).length-2);const o={id,type:state.rescueType,customer:'Nguyễn Minh Khoa',tel:'090 123 4567',vehicle:VEHICLES[state.vehicle].name,location:state.rescueAddress,cost:rescueCost(),step:0,assigned:false,date:'14/10/2026',detail:state.rescueDescription||'Khách hàng cần hỗ trợ tại vị trí đã chọn.'};state.orders.unshift(o);state.ownOrder=id;go('track');toast('Đã gửi yêu cầu '+id+'. Chờ Admin phân công.');return}case'assign':{const o=order(d.id);if(o&&!o.assigned){o.assigned=true;o.step=1;state.activeOrder=o.id;render({keepScroll:true});toast('Đã phân công '+o.id+' cho NEC Partner.')}return}case'partner-detail':state.activeOrder=d.id;state.partnerPage='detail';render();return;case'partner-next':{const o=order(d.id);if(!o||!o.assigned)return;if(o.step<4){const inp=document.getElementById('partner-cost');if(inp&&inp.value!==''&&Number(inp.value)>=0)o.cost=Number(inp.value);o.step++;render({keepScroll:true});toast('Đã cập nhật trạng thái: '+steps[o.step]);}return}case'paytab':state.payTab=d.value;render({keepScroll:true});return;case'vehicle':state.vehicle=Number(d.index);go('profile');toast('Đã chọn '+VEHICLES[state.vehicle].name);return;case'cancel-order':{let o=order(state.ownOrder);if(o&&o.step===0&&confirm('Hủy yêu cầu cứu hộ '+o.id+'?')){state.orders=state.orders.filter(x=>x.id!==o.id);state.ownOrder=null;go('rescue');toast('Đã hủy yêu cầu.')}return}case'directions':directions();return;case'call':window.location.href='tel:'+(state.role==='partner'?(order(state.activeOrder)?.tel||'0983023333').replace(/[^+\d]/g,''):'0983023333');return;case'email':window.location.href='mailto:info@necc.com.vn';return;case'add-vehicle':toast('Tính năng thêm xe có trong phạm vi thiết kế; biểu mẫu chi tiết chưa dựng trong demo này.');return;case'demo-add':toast('Đây là chức năng cấu hình minh họa; không ghi dữ liệu vào máy chủ.');return;case'rate':{const value=prompt('Bạn đánh giá trải nghiệm hỗ trợ mấy sao? (1–5)','5');if(value)toast('Cảm ơn bạn đã đánh giá '+value+' sao!');return}default:return}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;e.preventDefault();handle(b.dataset.action,b.dataset)});
document.addEventListener('input',e=>{if(e.target.id==='station-search'){state.search=e.target.value;const oldScroll=document.getElementById('screenScroll')?.scrollTop||0;const start=e.target.selectionStart;render({keepScroll:true});const n=document.getElementById('station-search');if(n){n.focus();n.setSelectionRange(start,start)}const sc=document.getElementById('screenScroll');if(sc)sc.scrollTop=oldScroll;}else if(e.target.id==='rescue-desc'){state.rescueDescription=e.target.value}});
document.addEventListener('change',e=>{if(e.target.id==='image-upload'){state.uploadCount=e.target.files.length;render({keepScroll:true});toast('Đã chọn '+state.uploadCount+' ảnh. Ảnh không được tải lên máy chủ.')}});
render();
</script>
</body>
</html>
